name: CI

on:
  push:
    tags: ['**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
  DOTNET_CLI_HOME: ${{ github.workspace }}/output/migration/dotnet-home
  NUGET_PACKAGES: ${{ github.workspace }}/output/migration/nuget

jobs:
  publish:
    name: Publish ${{ matrix.variant }}
    if: github.event.created && !github.event.deleted
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [aot, self-contained, framework-dependent]
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          lfs: true
      - name: Set up native build environment
        uses: ./.github/actions/setup-native
      - name: Prepare pinned native dependencies
        run: |
          ./packaging/prepare-documents.ps1
          ./packaging/prepare-webp.ps1
          ./packaging/prepare-runtime.ps1
      - name: Build and package
        id: package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          BUILD_VARIANT: ${{ matrix.variant }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $baseline = ./packaging/Get-VelopackBaseline.ps1 -Repository $env:GITHUB_REPOSITORY -Variant $env:BUILD_VARIANT -CurrentTag $env:RELEASE_TAG -OutputDirectory "output/ci/baseline/$env:BUILD_VARIANT"
          ./packaging/Invoke-CI.ps1 -Phase Build -Variant $env:BUILD_VARIANT -BaselinePackage $baseline
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./.github/scripts/Publish-Release.ps1 -Tag $env:RELEASE_TAG -Repository $env:GITHUB_REPOSITORY -Variant ${{ matrix.variant }} -AssetDirectory output/ci/artifacts/${{ matrix.variant }}
