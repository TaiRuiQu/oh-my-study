name: Set up native Windows build
description: Install the locked SDK and cache only pinned packages and native dependencies.
runs:
  using: composite
  steps:
    - name: Install locked .NET SDK
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json
    - name: Cache NuGet packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: output/migration/nuget
        key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json', 'NuGet.Config', 'Directory.Packages.props', '**/packages*.lock.json') }}
    - name: Cache Velopack CLI
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: output/ci/tools
        key: vpk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packaging/velopack.lock.json') }}
    - name: Cache pinned native dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: output/migration/toolchain
        key: native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packaging/native-documents.lock.json', 'packaging/prepare-documents.ps1', 'packaging/runtime.lock.json', 'packaging/webp.lock.json', 'packaging/restoration.lock.json', 'packaging/prepare-runtime.ps1', 'packaging/prepare-webp.ps1', 'packaging/prepare-restoration.ps1', 'packaging/models/restoration/*', 'runtime/*.py') }}
