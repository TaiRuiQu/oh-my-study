<title>Oh My Study</title>
<style>

.review-header { height:76px; display:flex; align-items:center; gap:8px; padding:14px 13px 12px; }

.review-stage.swiping { transition:none; }
#tray-result { display:block; width:100%; height:100%; object-fit:contain; object-position:center top; transform-origin:0 0; -webkit-user-drag:none; }
.large-selection { position:absolute; z-index:1; top:9px; left:9px; width:30px; height:30px; background:#7779; border-radius:8px; display:grid; place-items:center; cursor:pointer; }
.large-selection input { width:22px; height:22px; margin:0; cursor:pointer; accent-color:var(--accent); }

.empty { text-align:center; padding:90px 24px; }
.empty>.icon { width:60px; height:60px; color:#93969f; margin-bottom:18px; }

.empty .primary { border-radius:24px; padding:10px 22px; }
.batch-state { position:absolute; z-index:2; top:95px; left:50%; transform:translateX(-50%); width:min(calc(100% - 72px),480px); background:#ffffffed; border-radius:12px; padding:10px 12px; box-shadow:0 4px 20px #0001; }

.batch-state button { min-height:28px; font-size:12px; padding:3px 6px; color:var(--accent); }

#resume-previews { display:flex; margin:12px auto; background:white; color:var(--accent); }
.grid-toolbar { display:flex; align-items:center; justify-content:space-between; padding:0 20px 8px; font-size:13px; color:var(--muted); }
.grid-toolbar button { font-size:13px; color:var(--accent); }
.grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px 12px; padding:0 20px 20px; margin:0; list-style:none; }

.review-dock { position:fixed; z-index:5; left:50%; bottom:0; transform:translateX(-50%); width:min(100%,600px); padding:0 13px max(12px,env(safe-area-inset-bottom)); background:var(--canvas); }

.pager .icon { width:19px; height:19px; }
.continue-camera { font-size:15px; font-weight:600; padding-right:0; gap:3px; }

.detail-content { padding:0 24px 24px; }

#photo { width:100%; height:auto; display:block; }

.settings { display:flex; align-items:center; flex-wrap:wrap; gap:10px; margin:14px 0; font-size:14px; }

select { min-height:44px; max-width:100%; background:white; color:#242529; border:0; border-radius:12px; padding:8px 12px; }

.advanced summary { padding:14px 0; min-height:44px; cursor:pointer; }

.sheet-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
.sheet-header h2 { font-size:18px; }
.connection-help { font-size:12px; color:#737680; }

.review-tools button { display:grid; grid-template-rows:32px 20px; justify-items:center; align-content:center; row-gap:8px; min-height:76px; padding:8px 2px; font-size:13px; line-height:20px; font-weight:450; }

.pager { line-height:32px; }
.pager button { width:32px; height:32px; min-height:32px; }
.page-navigation .compare,.continue-camera { height:40px; line-height:24px; align-items:center; }
.review-tabs button { line-height:24px; font-weight:500; }

.page-state,.connection-help,.sent,.empty p { color:#626672; }

ance"><span data-text="Enhance appearance"></span></label></fieldset><button id="reset-page-processing" data-text="Turn off all processing"></button></details>
</div></div>

urn off all processing"></button><p class="connection-help" data-text="Each processing step can be turned off."></p><p class="connection-help" data-text="Opening Review sends originals directly to this computer for local correction. Only confirmed pages can be imported."></p><p class="connection-help" data-text="Up to 12 pages, 64 MB per file, 256 MB per import. Originals and processed copies both count toward the limit."></p><p class="connection-help" data-text="Keep this page open. Unsaved photos are lost if you reload. The connection lasts 20 minutes."></p></dialog>
